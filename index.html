<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MacroTracker AI</title>
<style>
  html{background:#082f49; overscroll-behavior:none; height:100%;}
  body{
    margin:0; min-height:100svh; min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:linear-gradient(180deg,#0c4a6e 0%,#075985 25%,#0c3b5e 55%,#082f49 100%);
    color:#e2e8f0; overscroll-behavior:none;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
    position:relative;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button,input,select{touch-action:manipulation; font-size:16px;}
  input,select{
    font-family:inherit; color:#e2e8f0; background:rgba(15,23,42,0.55);
    border:1px solid rgba(148,163,184,0.25); border-radius:14px; padding:14px 16px; width:100%;
  }
  input::placeholder{color:#64748b;}

  /* ===================== BUBBLE BACKGROUND LAYER (fixed, never re-rendered) ===================== */
  #globalBg{
    position:fixed; inset:0; width:100vw; height:100vh;
    overflow:hidden; z-index:0; pointer-events:none;
  }
  .bubble-dumbbell{
    position:absolute; bottom:-120px; opacity:0;
    filter:drop-shadow(0 0 6px rgba(125,211,252,0.45));
    animation-name:bubbleRise; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes bubbleRise{
    0%{ transform:translate(0,0) rotate(0deg); opacity:0; }
    8%{ opacity:0.85; }
    50%{ transform:translate(18px,-55vh) rotate(8deg); }
    92%{ opacity:0.7; }
    100%{ transform:translate(-10px,-115vh) rotate(-6deg); opacity:0; }
  }
  .db-1{ left:8%;  width:34px; animation-duration:17s; animation-delay:0s; }
  .db-2{ left:28%; width:22px; animation-duration:13s; animation-delay:3s; }
  .db-3{ left:52%; width:40px; animation-duration:21s; animation-delay:1.2s; }
  .db-4{ left:72%; width:26px; animation-duration:15s; animation-delay:6s; }
  .db-5{ left:88%; width:30px; animation-duration:19s; animation-delay:4.5s; }
  .sparkle{ animation:twinkle 2.4s ease-in-out infinite; }
  .sparkle-delay{ animation:twinkle 2.4s ease-in-out infinite 1.1s; }
  @keyframes twinkle{ 0%,100%{opacity:0.1;} 50%{opacity:1;} }

  #app{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:18px; }

  /* ===================== TITLE ===================== */
  .macro-title-float{ animation:bob 4s ease-in-out infinite; display:inline-block; }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .macro-title-card{
    background:rgba(30,41,59,0.5); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(148,163,184,0.18); border-radius:16px; padding:12px 22px;
  }
  .macro-title-card h2{ margin:0; font-size:20px; letter-spacing:0.3px; }
  .top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .settings-wrap{ position:relative; }
  .gear-btn{ background:none; border:none; font-size:26px; cursor:pointer; transition:transform .35s ease; }
  .gear-btn.spin{ transform:rotate(180deg); }
  .settings-menu{
    position:absolute; right:0; top:40px; background:rgba(15,23,42,0.9); backdrop-filter:blur(14px);
    border:1px solid rgba(148,163,184,0.25); border-radius:14px; overflow:hidden; min-width:180px;
    display:none; z-index:50;
  }
  .settings-menu.open{ display:block; }
  .settings-menu button{
    display:block; width:100%; text-align:left; background:none; border:none; color:#e2e8f0;
    padding:14px 16px; font-size:15px; cursor:pointer; border-bottom:1px solid rgba(148,163,184,0.12);
  }
  .settings-menu button:last-child{ border-bottom:none; }

  /* ===================== STAT BOXES / GAUGES (minimalist, static) ===================== */
  .card{
    background:rgba(15,23,42,0.45); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(148,163,184,0.18); border-radius:20px; padding:18px; margin-bottom:18px;
  }
  .stats{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .stat-box{
    background:rgba(15,23,42,0.5); border:1px solid rgba(148,163,184,0.2); border-radius:18px;
    padding:16px; text-align:center; transition:box-shadow .4s ease, border-color .4s ease;
  }
  .stat-box.target-reached{ border-color:rgba(94,234,212,0.6); box-shadow:0 0 16px rgba(94,234,212,0.3); }
  .stat-box.over-limit{ border-color:rgba(248,113,113,0.6); box-shadow:0 0 16px rgba(248,113,113,0.3); }
  .meter-label{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:#94a3b8; margin-bottom:8px; }
  .gauge-wrap{ display:flex; justify-content:center; }
  .gauge-svg{ width:100%; max-width:210px; height:auto; }
  .meter-text{ margin-top:6px; font-weight:700; font-size:16px; color:#cbd5e1; transition:color .4s ease; }
  .meter-text.target-reached{ color:#5eead4; }
  .meter-text.over-limit{ color:#f87171; }

  /* ===================== LIQUID GLASS BUTTONS ===================== */
  .liquid-btn{
    width:100%; padding:16px; border-radius:16px; font-size:16px; font-weight:700; color:#e0f2fe;
    background:rgba(13,25,48,0.5); border:1px solid rgba(148,197,253,0.22);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    cursor:pointer; margin-bottom:12px; transition:transform .15s ease;
  }
  .liquid-btn:active{ transform:scale(0.97); }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }

  /* ===================== PROGRESS / WATER BAR ===================== */
  #progressWrap{ margin-top:4px; display:none; }
  .progress-track{
    position:relative; width:100%; height:26px; border-radius:14px; overflow:hidden;
    background:rgba(15,23,42,0.55); border:1px solid rgba(148,197,253,0.25);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .progress-fill{
    position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:14px;
    background:linear-gradient(90deg,#0369a1,#38bdf8,#7dd3fc,#38bdf8,#0369a1);
    background-size:200% 100%;
    animation:waterFlow 2.2s linear infinite;
    transition:width .3s ease;
  }
  @keyframes waterFlow{ 0%{background-position:0% 0;} 100%{background-position:200% 0;} }
  @keyframes waterWave{ 0%{background-position-x:0;} 100%{background-position-x:26px;} }
  .progress-text{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.6); font-size:13px; z-index:2;
  }

  /* Full screen success overlay (onboarding complete) */
  .fs-success-overlay{
    position:fixed; inset:0; z-index:200; background:rgba(5,14,26,0.85);
    backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; flex-direction:column;
  }
  .fs-success-overlay.show{ display:flex; animation:fadeInUp .3s ease; }
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .fs-success-check{ width:100px; height:100px; }
  .fs-success-check circle{
    stroke:#34d399; stroke-width:4; fill:rgba(52,211,153,0.08);
    stroke-dasharray:300; stroke-dashoffset:300; animation:circleDraw .6s ease forwards;
  }
  .fs-success-check path{
    stroke:#34d399; stroke-width:6; fill:none; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:80; stroke-dashoffset:80; animation:checkDraw .4s ease forwards .55s;
  }
  @keyframes circleDraw{ to{stroke-dashoffset:0;} }
  @keyframes checkDraw{ to{stroke-dashoffset:0;} }
  .fs-success-title{ color:#e2f8ef; font-size:19px; font-weight:800; margin-top:18px; }

  /* ===================== FOOD LOG ===================== */
  .food-card{
    display:flex; gap:12px; align-items:center; background:rgba(15,23,42,0.5);
    border:1px solid rgba(148,163,184,0.18); border-radius:16px; padding:10px; margin-bottom:10px;
  }
  .food-thumb{ width:54px; height:54px; border-radius:12px; object-fit:cover; background:rgba(148,163,184,0.15);
    display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .food-info{ flex:1; min-width:0; }
  .food-name{ font-weight:700; margin-bottom:6px; font-size:14px; }
  .food-macros{ display:flex; gap:6px; flex-wrap:wrap; }
  .macro-chip{ font-size:11px; padding:3px 8px; border-radius:10px; font-weight:700; }
  .chip-cal{ background:rgba(56,189,248,0.18); color:#7dd3fc; }
  .chip-pro{ background:rgba(74,222,128,0.18); color:#86efac; }
  .chip-carb{ background:rgba(250,204,21,0.18); color:#fde68a; }
  .chip-fat{ background:rgba(244,114,182,0.18); color:#f9a8d4; }
  .del-btn{ background:none; border:none; color:#64748b; font-size:18px; cursor:pointer; padding:4px 8px; }
  .empty-log{ text-align:center; color:#64748b; padding:20px 0; }

  /* ===================== ONBOARDING ===================== */
  .onboard-screen{
    position:fixed; inset:0; z-index:100; background:linear-gradient(180deg,#0c4a6e,#082f49);
    padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
    overflow-y:auto; display:flex; align-items:center; justify-content:center;
  }
  .floating-card{
    width:100%; max-width:480px; animation:bob 4s ease-in-out infinite;
    background:rgba(15,23,42,0.55); border:1px solid rgba(148,163,184,0.2); border-radius:22px;
    padding:28px 22px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    margin:40px 0;
  }
  .ob-title{ font-size:20px; font-weight:800; text-align:center; margin-bottom:22px; }
  .cancel-btn{
    position:fixed; top:calc(env(safe-area-inset-top) + 14px); left:14px; z-index:110;
    background:rgba(15,23,42,0.6); border:1px solid rgba(148,163,184,0.25); color:#e2e8f0;
    border-radius:12px; padding:10px 16px; font-weight:700; cursor:pointer;
  }

  /* sex selector */
  .sex-row{ display:flex; gap:14px; justify-content:center; margin-bottom:22px; }
  .sex-card{
    flex:1; max-width:140px; background:rgba(15,23,42,0.5); border:2px solid rgba(148,163,184,0.25);
    border-radius:18px; padding:16px 8px; text-align:center; cursor:pointer; transition:all .3s ease;
  }
  .sex-card.selected{ border-color:#38bdf8; box-shadow:0 0 18px rgba(56,189,248,0.55); background:rgba(56,189,248,0.1); }
  .sex-card svg{ width:60px; height:70px; }
  .sex-card .lbl{ margin-top:8px; font-weight:700; font-size:14px; }
  .arm{ transition:transform .35s ease; transform-origin:center; }
  .sex-card.selected .arm-l{ transform:rotate(35deg) translate(-2px,2px); }
  .sex-card.selected .arm-r{ transform:rotate(-35deg) translate(2px,2px); }

  /* goal selector (KEPT: 3 glowing boxes) */
  .goal-row{ display:flex; gap:12px; margin-bottom:22px; }
  .goal-card{
    flex:1; background:rgba(15,23,42,0.5); border:2px solid rgba(148,163,184,0.22);
    border-radius:16px; padding:16px 6px; text-align:center; cursor:pointer; transition:all .3s ease;
  }
  .goal-card .icon{ font-size:26px; display:block; margin-bottom:6px; }
  .goal-card .lbl{ font-size:12.5px; font-weight:700; }
  .goal-card.selected.lose{ border-color:#38bdf8; box-shadow:0 0 18px rgba(56,189,248,0.6); background:rgba(56,189,248,0.1); }
  .goal-card.selected.gain{ border-color:#c084fc; box-shadow:0 0 18px rgba(192,132,252,0.6); background:rgba(192,132,252,0.1); }
  .goal-card.selected.maintain{ border-color:#34d399; box-shadow:0 0 18px rgba(52,211,153,0.6); background:rgba(52,211,153,0.1); }

  .step-row{ display:flex; gap:12px; margin-top:10px; }
  .nav-btn{
    flex:1; padding:14px; border-radius:14px; border:1px solid rgba(148,163,184,0.25);
    background:rgba(56,189,248,0.18); color:#e0f2fe; font-weight:800; cursor:pointer;
  }
  .nav-btn.secondary{ background:rgba(148,163,184,0.12); }
  .field-label{ font-size:13px; color:#94a3b8; margin:12px 0 6px; font-weight:600; }

  /* height slider + stick figure */
  .hw-row{ display:flex; gap:18px; }
  .ruler-col{ width:60px; flex-shrink:0; }
  .ruler-track{
    position:relative; width:30px; height:260px; margin:0 auto; background:rgba(148,163,184,0.15);
    border-radius:16px; border:1px solid rgba(148,163,184,0.25);
  }
  .ruler-fill{ position:absolute; bottom:0; left:0; right:0; background:rgba(56,189,248,0.35); border-radius:0 0 16px 16px; }
  .ruler-handle{
    position:absolute; left:50%; width:44px; height:28px; background:#38bdf8; border-radius:10px;
    transform:translate(-50%,50%); cursor:grab; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#06283d; box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  .stick-col{ flex:1; display:flex; align-items:flex-end; justify-content:center; }

  /* cancel confirm modal */
  .cancel-modal-overlay{
    position:fixed; inset:0; z-index:150; background:rgba(5,14,26,0.75); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center;
  }
  .cancel-modal-overlay.show{ display:flex; }
  .confirm-card{
    background:rgba(15,23,42,0.85); border:1px solid rgba(148,163,184,0.25); border-radius:20px;
    padding:24px; max-width:320px; text-align:center;
  }
  .stickman-wiggle{ animation:wiggle 1.4s ease-in-out infinite; }
  @keyframes wiggle{ 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
  .confirm-card h3{ margin:14px 0 18px; font-size:16px; }
  .confirm-btns{ display:flex; flex-direction:column; gap:10px; }
  .yes-btn{ background:rgba(248,113,113,0.2); border:1px solid rgba(248,113,113,0.4); color:#fecaca;
    padding:12px; border-radius:12px; font-weight:700; cursor:pointer; }
  .no-btn{ background:rgba(148,163,184,0.15); border:1px solid rgba(148,163,184,0.3); color:#e2e8f0;
    padding:12px; border-radius:12px; font-weight:700; cursor:pointer; }

  /* API key modal */
  .glass-modal-card{
    background:rgba(8,30,38,0.75); border:1px solid rgba(186,230,253,0.25); border-radius:20px;
    padding:24px; max-width:340px; width:90%; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }
  .glass-modal-card input{ margin-bottom:14px; }
  .glass-modal-card input::placeholder{ color:#7dd3fc; opacity:0.6; }
  .save-key-btn{ background:rgba(56,189,248,0.25); border:1px solid rgba(125,211,252,0.4); color:#e0f2fe; }
  .cancel-key-btn{ background:rgba(148,163,184,0.12); border:1px solid rgba(148,163,184,0.25); color:#cbd5e1; margin-top:8px; }

  h3.modal-title{ margin:0 0 14px; text-align:center; font-size:17px; }
</style>
</head>
<body>

<!-- FIXED BUBBLE BACKGROUND -->
<div id="globalBg">
  <svg style="position:absolute;width:0;height:0">
    <radialGradient id="bubbleGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
  </svg>
  <svg class="bubble-dumbbell db-1" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="url(#bubbleGrad)"/><ellipse cx="21" cy="19" rx="9" ry="5" fill="rgba(255,255,255,0.55)"/><circle class="sparkle" cx="42" cy="18" r="2.2" fill="#fff"/><circle class="sparkle-delay" cx="16" cy="40" r="1.6" fill="#fff"/></svg>
  <svg class="bubble-dumbbell db-2" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="url(#bubbleGrad)"/><ellipse cx="21" cy="19" rx="9" ry="5" fill="rgba(255,255,255,0.55)"/><circle class="sparkle" cx="42" cy="18" r="2" fill="#fff"/><circle class="sparkle-delay" cx="18" cy="38" r="1.4" fill="#fff"/></svg>
  <svg class="bubble-dumbbell db-3" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="url(#bubbleGrad)"/><ellipse cx="21" cy="19" rx="9" ry="5" fill="rgba(255,255,255,0.55)"/><circle class="sparkle" cx="43" cy="20" r="2.4" fill="#fff"/><circle class="sparkle-delay" cx="17" cy="41" r="1.8" fill="#fff"/></svg>
  <svg class="bubble-dumbbell db-4" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="url(#bubbleGrad)"/><ellipse cx="21" cy="19" rx="9" ry="5" fill="rgba(255,255,255,0.55)"/><circle class="sparkle" cx="41" cy="19" r="2" fill="#fff"/><circle class="sparkle-delay" cx="19" cy="39" r="1.5" fill="#fff"/></svg>
  <svg class="bubble-dumbbell db-5" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="url(#bubbleGrad)"/><ellipse cx="21" cy="19" rx="9" ry="5" fill="rgba(255,255,255,0.55)"/><circle class="sparkle" cx="42" cy="18" r="2.1" fill="#fff"/><circle class="sparkle-delay" cx="16" cy="40" r="1.6" fill="#fff"/></svg>
</div>

<div id="app"></div>

<div id="onboardScreen" class="onboard-screen" style="display:none;"></div>

<!-- Cancel confirm modal -->
<div id="cancelConfirmModal" class="cancel-modal-overlay">
  <div class="confirm-card">
    <svg class="stickman-wiggle" width="90" height="100" viewBox="0 0 90 100">
      <circle cx="45" cy="25" r="16" fill="none" stroke="#e2e8f0" stroke-width="3"/>
      <circle cx="40" cy="22" r="1.6" fill="#e2e8f0"/><circle cx="50" cy="22" r="1.6" fill="#e2e8f0"/>
      <path d="M38 30 Q45 26 52 30" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-linecap="round"/>
      <line x1="45" y1="41" x2="45" y2="75" stroke="#e2e8f0" stroke-width="3"/>
      <line x1="45" y1="50" x2="25" y2="42" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
      <path d="M62 35 Q70 20 60 15" stroke="#e2e8f0" stroke-width="3" fill="none" stroke-linecap="round"/>
      <line x1="45" y1="75" x2="30" y2="98" stroke="#e2e8f0" stroke-width="3"/>
      <line x1="45" y1="75" x2="58" y2="98" stroke="#e2e8f0" stroke-width="3"/>
      <text x="70" y="10" font-size="16" fill="#e2e8f0">?</text>
    </svg>
    <h3>Are you sure you want to discard your changes?</h3>
    <div class="confirm-btns">
      <button class="yes-btn" onclick="doCancelOnboarding()">Yes, I am!</button>
      <button class="no-btn" onclick="closeCancelModal()">No, i hate myself</button>
    </div>
  </div>
</div>

<!-- API Key modal -->
<div id="apiKeyModal" class="cancel-modal-overlay">
  <div class="glass-modal-card">
    <h3 class="modal-title">🔑 Gemini API Key</h3>
    <input id="apiKeyInput" type="text" placeholder="Paste your API key here">
    <button class="liquid-btn save-key-btn" onclick="saveApiKeyFn()">Save</button>
    <button class="liquid-btn cancel-key-btn" onclick="closeApiKeyModal()">Cancel</button>
  </div>
</div>

<!-- Full screen success overlay (KEPT) -->
<div id="fsSuccessOverlay" class="fs-success-overlay">
  <svg class="fs-success-check" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46"/>
    <path d="M30 52 L44 66 L72 36"/>
  </svg>
  <div class="fs-success-title" id="fsSuccessText">Your data has been updated</div>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">

<script>
/* ============================= STATE ============================= */
let profile = JSON.parse(localStorage.getItem('user_profile') || 'null');
let goals = JSON.parse(localStorage.getItem('user_goals') || 'null');
let obData = {};
let isEditingExisting = false;
let pendingThumb = null;

function todayKey(){ return new Date().toISOString().slice(0,10); }
function getLogs(){
  const all = JSON.parse(localStorage.getItem('macro_logs') || '{}');
  return all[todayKey()] || [];
}
function saveLogs(arr){
  const all = JSON.parse(localStorage.getItem('macro_logs') || '{}');
  all[todayKey()] = arr;
  localStorage.setItem('macro_logs', JSON.stringify(all));
}

/* ============================= GAUGE RENDER (minimalist, static) ============================= */
function gaugeSvg(id){
  return `
  <div class="gauge-wrap">
  <svg class="gauge-svg" viewBox="0 0 200 110">
    <defs><linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient></defs>
    <path d="M20,100 A80,80 0 0,1 180,100" fill="none" stroke="url(#gaugeGrad)" stroke-width="14" stroke-linecap="round"/>
    <g id="${id}Needle" style="transition:transform .6s cubic-bezier(.4,1.4,.6,1)">
      <line x1="100" y1="100" x2="100" y2="30" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
      <circle cx="100" cy="100" r="7" fill="#cbd5e1"/>
    </g>
  </svg>
  </div>`;
}
function updateGauge(id, value, target){
  const pct = target>0 ? value/target : 0;
  const clamped = Math.max(0, Math.min(1, pct));
  const angle = -90 + 180*clamped;
  const needle = document.getElementById(id+'Needle');
  const box = document.getElementById(id+'Box');
  const text = document.getElementById(id+'Text');
  if(needle) needle.setAttribute('transform', `rotate(${angle},100,100)`);

  box.classList.remove('target-reached','over-limit');
  text.classList.remove('target-reached','over-limit');
  const line = needle.querySelector('line');
  const dot = needle.querySelector('circle');
  let color = '#cbd5e1';

  if(id==='pro' && value>=target && target>0){
    box.classList.add('target-reached'); text.classList.add('target-reached'); color='#5eead4';
  }
  if(id==='cal' && value>target && target>0){
    box.classList.add('over-limit'); text.classList.add('over-limit'); color='#f87171';
  }
  line.setAttribute('stroke', color);
  dot.setAttribute('fill', color);
}

/* ============================= PHOTO SCAN ============================= */
document.getElementById('photoInput').addEventListener('change', handlePhoto);

function compressImage(file, maxSize, quality){
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxSize){ h*=maxSize/w; w=maxSize; } } else { if(h>maxSize){ w*=maxSize/h; h=maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handlePhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  const apiKey = localStorage.getItem('gemini_key');
  if(!apiKey){ setApiKey(); return; }

  const bigImg = await compressImage(file, 800, 0.7);
  pendingThumb = await compressImage(file, 160, 0.5);

  const wrap = document.getElementById('progressWrap');
  const fill = document.getElementById('progressFill');
  const text = document.getElementById('progressText');
  wrap.style.display='block';
  fill.style.width='0%'; text.textContent='0%';

  let pct = 0;
  const timer = setInterval(()=>{
    pct = Math.min(92, pct + (92-pct)*0.08 + 0.4);
    fill.style.width = pct+'%';
    text.textContent = Math.round(pct)+'%';
  }, 180);

  try{
    const base64 = bigImg.split(',')[1];
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        contents:[{ parts:[
          {text:'Identify this meal. Respond ONLY with compact JSON: {"name":"...","cal":number,"pro":number,"carb":number,"fat":number}'},
          {inline_data:{mime_type:'image/jpeg', data:base64}}
        ]}]
      })
    });
    const data = await res.json();
    clearInterval(timer);
    fill.style.width='100%'; text.textContent='100%';

    const raw = data.candidates[0].content.parts[0].text;
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    const parsed = JSON.parse(jsonMatch[0]);

    document.getElementById('foodName').value = parsed.name || '';
    document.getElementById('foodCal').value = parsed.cal || '';
    document.getElementById('foodPro').value = parsed.pro || '';
    document.getElementById('foodCarb').value = parsed.carb || '';
    document.getElementById('foodFat').value = parsed.fat || '';

    setTimeout(()=>{ wrap.style.display='none'; }, 900);
  }catch(err){
    clearInterval(timer);
    text.textContent='ERROR';
    fill.style.width='100%';
    setTimeout(()=>{ wrap.style.display='none'; }, 1500);
  }
  e.target.value='';
}

/* ============================= ONBOARDING ============================= */
function openOnboarding(editing){
  isEditingExisting = !!editing;
  obData = editing && profile ? {...profile} : { age:25, sex:'male', height:170, weight:70, goal:'lose', goalWeight:65, timeline:8, exercise:3 };
  document.getElementById('settingsMenu').classList.remove('open');
  document.getElementById('gearBtn').classList.remove('spin');
  renderStep(1);
  document.getElementById('onboardScreen').style.display='flex';
}

function renderStep(n){
  const screen = document.getElementById('onboardScreen');
  let cancelBtn = isEditingExisting ? `<button class="cancel-btn" onclick="openCancelModal()">← Cancel</button>` : '';
  let html = cancelBtn + `<div class="floating-card">`;

  if(n===1){
    html += `
      <div class="ob-title">About You</div>
      <div class="field-label">Age</div>
      <input type="number" id="ageInput" value="${obData.age}">
      <div class="field-label">Biological Sex</div>
      <div class="sex-row">
        <div class="sex-card ${obData.sex==='male'?'selected':''}" onclick="selectSex('male')">
          ${stickSvg()}<div class="lbl">Boy</div>
        </div>
        <div class="sex-card ${obData.sex==='female'?'selected':''}" onclick="selectSex('female')">
          ${stickSvg()}<div class="lbl">Girl</div>
        </div>
      </div>
      <div class="step-row"><button class="nav-btn" onclick="goToStep(2)">Next →</button></div>
    `;
  } else if(n===2){
    html += `
      <div class="ob-title">Body Metrics</div>
      <div class="hw-row">
        <div class="ruler-col">
          <div class="ruler-track" id="heightTrack">
            <div class="ruler-fill" id="heightFill"></div>
            <div class="ruler-handle" id="heightHandle">${obData.height}</div>
          </div>
        </div>
        <div class="stick-col">${stickFigureSvg(obData.height, obData.weight)}</div>
      </div>
      <div class="field-label">Height (cm)</div>
      <input type="number" id="heightInput" value="${obData.height}">
      <div class="field-label">Current Weight (kg)</div>
      <input type="number" id="weightInput" value="${obData.weight}">
      <div class="step-row">
        <button class="nav-btn secondary" onclick="renderStep(1)">← Back</button>
        <button class="nav-btn" onclick="goToStep(3)">Next →</button>
      </div>
    `;
  } else if(n===3){
    html += `
      <div class="ob-title">Your Goal</div>
      <div class="goal-row">
        <div class="goal-card lose ${obData.goal==='lose'?'selected lose':''}" onclick="selectGoal('lose')">
          <span class="icon">📉</span><div class="lbl">Lose Weight</div>
        </div>
        <div class="goal-card gain ${obData.goal==='gain'?'selected gain':''}" onclick="selectGoal('gain')">
          <span class="icon">💪</span><div class="lbl">Gain Muscle</div>
        </div>
        <div class="goal-card maintain ${obData.goal==='maintain'?'selected maintain':''}" onclick="selectGoal('maintain')">
          <span class="icon">⚖️</span><div class="lbl">Maintain</div>
        </div>
      </div>
      <div id="goalWeightWrap" style="display:${obData.goal==='maintain'?'none':'block'}">
        <div class="field-label">Goal Weight (kg)</div>
        <input type="number" id="goalWeightInput" value="${obData.goalWeight}">
      </div>
      <div class="step-row">
        <button class="nav-btn secondary" onclick="renderStep(2)">← Back</button>
        <button class="nav-btn" onclick="goToStep(4)">Next →</button>
      </div>
    `;
  } else if(n===4){
    html += `
      <div class="ob-title">Timeline & Activity</div>
      <div id="timelineWrap" style="display:${obData.goal==='maintain'?'none':'block'}">
        <div class="field-label">Timeline (weeks)</div>
        <input type="number" id="timelineInput" value="${obData.timeline}">
      </div>
      <div class="field-label">Exercise per week (sessions)</div>
      <input type="number" id="exerciseInput" value="${obData.exercise}">
      <div class="step-row">
        <button class="nav-btn secondary" onclick="renderStep(3)">← Back</button>
        <button class="nav-btn" onclick="calculateGoals()">Calculate</button>
      </div>
    `;
  }

  html += `</div>`;
  screen.innerHTML = html;

  if(n===2){
    positionHeightHandle(obData.height);
    setupHeightDrag();
    document.getElementById('heightInput').addEventListener('input', e=>{
      obData.height = Number(e.target.value)||100;
      positionHeightHandle(obData.height);
      updateStickFigureDOM(obData.height, obData.weight);
    });
    document.getElementById('weightInput').addEventListener('input', e=>{
      obData.weight = Number(e.target.value)||0;
      updateStickFigureDOM(obData.height, obData.weight);
    });
  }
}

function goToStep(n){
  if(n===2){ obData.age = Number(document.getElementById('ageInput').value)||obData.age; }
  if(n===3){
    obData.height = Number(document.getElementById('heightInput').value)||obData.height;
    obData.weight = Number(document.getElementById('weightInput').value)||obData.weight;
  }
  if(n===4){
    obData.goalWeight = Number(document.getElementById('goalWeightInput')?.value)||obData.goalWeight;
  }
  renderStep(n);
}

function selectSex(v){ obData.sex=v; renderStep(1); }
function selectGoal(v){ obData.goal=v; renderStep(3); }

function stickSvg(){
  return `<svg viewBox="0 0 60 70">
    <circle cx="30" cy="18" r="13" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="25" cy="16" r="1.4" fill="#e2e8f0"/><circle cx="35" cy="16" r="1.4" fill="#e2e8f0"/>
    <path d="M24 22 Q30 27 36 22" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="30" y1="31" x2="30" y2="55" stroke="#e2e8f0" stroke-width="3"/>
    <line class="arm arm-l" x1="30" y1="38" x2="14" y2="50" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <line class="arm arm-r" x1="30" y1="38" x2="46" y2="50" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="55" x2="20" y2="68" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="30" y1="55" x2="40" y2="68" stroke="#e2e8f0" stroke-width="3"/>
  </svg>`;
}

/* ===== Stick figure (height/weight) ===== */
function stickFigureSvg(h,w){
  return `<svg id="stickFigureSvg" viewBox="0 0 120 260" style="width:100px;height:240px;">${stickFigureInner(h,w)}</svg>`;
}
function stickFigureInner(h,w){
  const heightScale = 0.5 + (Math.max(100,Math.min(200,h))-100)/100*0.9;
  const bodyHeight = 90*heightScale;
  const weightCap = Math.min(w,200);
  const girth = 1 + (weightCap/200)*1.3;
  const headY = 130 - bodyHeight;
  return `
    <circle cx="60" cy="${headY}" r="18" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <circle cx="55" cy="${headY-2}" r="1.8" fill="#e2e8f0"/><circle cx="65" cy="${headY-2}" r="1.8" fill="#e2e8f0"/>
    <path d="M52 ${headY+5} Q60 ${headY+10} 68 ${headY+5}" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="60" cy="${headY+18+bodyHeight/2}" rx="${14*girth}" ry="${bodyHeight/2}" fill="rgba(56,189,248,0.25)" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="${60-20*girth}" y1="${headY+30}" x2="${60-10}" y2="${headY+18}" stroke="#e2e8f0" stroke-width="${3*girth}" stroke-linecap="round"/>
    <line x1="${60+20*girth}" y1="${headY+30}" x2="${60+10}" y2="${headY+18}" stroke="#e2e8f0" stroke-width="${3*girth}" stroke-linecap="round"/>
    <line x1="${60-8}" y1="${headY+18+bodyHeight}" x2="${60-16}" y2="260" stroke="#e2e8f0" stroke-width="${4*girth}" stroke-linecap="round"/>
    <line x1="${60+8}" y1="${headY+18+bodyHeight}" x2="${60+16}" y2="260" stroke="#e2e8f0" stroke-width="${4*girth}" stroke-linecap="round"/>
  `;
}
function updateStickFigureDOM(h,w){
  const svg = document.getElementById('stickFigureSvg');
  if(svg) svg.innerHTML = stickFigureInner(h,w);
}

/* ===== Height ruler drag ===== */
function positionHeightHandle(val){
  const track = document.getElementById('heightTrack');
  if(!track) return;
  const pct = (Math.max(100,Math.min(200,val))-100)/100;
  const h = track.offsetHeight;
  const handle = document.getElementById('heightHandle');
  const fill = document.getElementById('heightFill');
  const y = h*(1-pct);
  handle.style.top = y+'px';
  handle.textContent = Math.round(val);
  fill.style.height = (h-y)+'px';
}
function setupHeightDrag(){
  const track = document.getElementById('heightTrack');
  const handle = document.getElementById('heightHandle');
  function setFromClientY(clientY){
    const rect = track.getBoundingClientRect();
    let pct = 1 - (clientY-rect.top)/rect.height;
    pct = Math.max(0,Math.min(1,pct));
    const val = Math.round(100+pct*100);
    obData.height = val;
    document.getElementById('heightInput').value = val;
    positionHeightHandle(val);
    updateStickFigureDOM(val, obData.weight);
  }
  handle.addEventListener('pointerdown', e=>{
    handle.setPointerCapture(e.pointerId);
    function move(ev){ setFromClientY(ev.clientY); }
    function up(ev){ handle.removeEventListener('pointermove',move); handle.removeEventListener('pointerup',up); }
    handle.addEventListener('pointermove',move);
    handle.addEventListener('pointerup',up);
  });
  track.addEventListener('pointerdown', e=>{ if(e.target!==handle) setFromClientY(e.clientY); });
}

/* ===== Cancel modal ===== */
function openCancelModal(){ document.getElementById('cancelConfirmModal').classList.add('show'); }
function closeCancelModal(){ document.getElementById('cancelConfirmModal').classList.remove('show'); }

/* ===== Calculate & finish (KEPT: full screen success) ===== */
function calculateGoals(){
  obData.weight = Number(document.getElementById('weightInput')?.value)||obData.weight;
  obData.height = Number(document.getElementById('heightInput')?.value)||obData.height;
  if(document.getElementById('goalWeightInput')) obData.goalWeight = Number(document.getElementById('goalWeightInput').value)||obData.goalWeight;
  if(document.getElementById('timelineInput')) obData.timeline = Number(document.getElementById('timelineInput').value)||obData.timeline;
  obData.exercise = Number(document.getElementById('exerciseInput').value)||obData.exercise;

  const {age, sex, height, weight, goal, goalWeight, timeline, exercise} = obData;
  let bmr = sex==='male'
    ? 10*weight + 6.25*height - 5*age + 5
    : 10*weight + 6.25*height - 5*age - 161;
  const activityMult = 1.2 + Math.min(exercise,7)*0.07;
  let tdee = bmr*activityMult;

  let calTarget = tdee;
  if(goal!=='maintain' && timeline>0){
    const weightDiff = goalWeight - weight;
    const totalCalDiff = weightDiff*7700;
    const dailyDelta = totalCalDiff/(timeline*7);
    calTarget = tdee + dailyDelta;
  }
  calTarget = Math.max(1200, Math.round(calTarget));
  const proteinMult = goal==='lose' ? 2.2 : 2.0;
  const proTarget = Math.round(weight*proteinMult);

  const wasEditing = isEditingExisting;
  profile = {age, sex, height, weight, goal, goalWeight, timeline, exercise};
  goals = {cal: calTarget, pro: proTarget};
  localStorage.setItem('user_profile', JSON.stringify(profile));
  localStorage.setItem('user_goals', JSON.stringify(goals));

  showFsSuccess(wasEditing ? 'Your data has been updated' : 'Your data has been saved', ()=>{
    document.getElementById('onboardScreen').style.display='none';
    renderApp();
  });
}

function showFsSuccess(msg, cb){
  const overlay = document.getElementById('fsSuccessOverlay');
  document.getElementById('fsSuccessText').textContent = msg;
  overlay.querySelectorAll('circle,path').forEach(el=>{ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; });
  overlay.classList.add('show');
  setTimeout(()=>{ overlay.classList.remove('show'); cb && cb(); }, 1900);
}

/* ============================= INIT ============================= */
document.addEventListener('click', e=>{
  const menu = document.getElementById('settingsMenu');
  const gear = document.getElementById('gearBtn');
  if(menu && menu.classList.contains('open') && !menu.contains(e.target) && e.target!==gear){
    menu.classList.remove('open'); gear.classList.remove('spin');
  }
});

if(!profile || !goals){
  openOnboarding(false);
} else {
  renderApp();
}
