<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Plan Selector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* General Body and Font Styles */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* Prevents scrollbars from the bubbles */
        }

        /* --- Start: Background Bubble Animation --- */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        /* Creating the bubbles using pseudo-elements */
        .background-container::before,
        .background-container::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 300%; /* Taller to make the loop seamless */
            top: -300%;
            left: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><g fill-opacity=".2" fill="%23FFFFFF"> <circle cx="100" cy="100" r="30"/> <circle cx="300" cy="300" r="15"/> <circle cx="500" cy="150" r="25"/> <circle cx="700" cy="400" r="20"/> <circle cx="150" cy="500" r="10"/> <circle cx="450" cy="650" r="35"/> <circle cx="650"cy="700" r="12"/> </g></svg>');
            background-repeat: repeat;
            animation: float-bubbles 40s linear infinite;
            will-change: transform; /* Performance hint */
        }

        .background-container::after {
            animation-delay: -20s; /* Offset the second layer */
            opacity: 0.7;
        }

        @keyframes float-bubbles {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(33.33%); /* Move up by one-third of the height */
            }
        }
        /* --- End: Background Bubble Animation --- */


        /* Main Content Containers */
        .main-container {
            background-color: rgba(24, 24, 24, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 800px;
            width: 90%;
            z-index: 1;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            color: #A0A0A0;
            margin-bottom: 30px;
        }

        /* Card Styles */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background-color: rgba(40, 40, 40, 0.8);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            width: 150px;
            height: 180px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            border-color: #5E5CE6;
            transform: translateY(-5px);
        }

        .card.selected {
            border-color: #5E5CE6;
            background-color: rgba(94, 92, 230, 0.2);
            box-shadow: 0 0 20px rgba(94, 92, 230, 0.5);
        }

        .card-icon {
            height: 60px;
            width: 100%;
            color: #E0E0E0;
            margin-bottom: 15px;
            transition: color 0.3s ease;
        }

        .card.selected .card-icon {
            color: #FFF;
        }

        .card h3 {
            margin: 5px 0;
            font-size: 1rem;
            font-weight: 600;
        }

        .card p {
            font-size: 0.8rem;
            color: #A0A0A0;
            margin-bottom: 0;
        }

        /* Submit Button */
        .submit-btn {
            background-color: #5E5CE6;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
        }

        .submit-btn:disabled {
            background-color: #444;
            color: #777;
            cursor: not-allowed;
        }

        .submit-btn:not(:disabled):hover {
            background-color: #7875ff;
            transform: scale(1.05);
        }


        /* --- NEW SVG ANIMATIONS --- */

        /* 1. Bed Animation (None) */
        @keyframes snore {
            0%, 100% {
                opacity: 0;
                transform: translate(0, 0) scale(0.8);
            }
            30% {
                opacity: 1;
                transform: translate(5px, -5px) scale(1);
            }
            80% {
                opacity: 0;
                transform: translate(10px, -15px) scale(1.2);
            }
        }
        .card.selected [data-value="0"] #z-char {
            animation: snore 2s infinite ease-out;
        }


        /* 2. Arm Curl Animation (1-3 days) */
        @keyframes curl {
            0%, 100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(-50deg);
            }
        }
        .card.selected [data-value="1-3"] #forearm,
        .card.selected [data-value="1-3"] #dumbbell {
            transform-origin: 60px 25px; /* Pivot at the elbow */
            animation: curl 1.8s infinite ease-in-out;
        }


        /* 3. Bicycle Wheel Animation (4-5 days) */
        @keyframes spin-wheels {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        .card.selected [data-value="4-5"] #bike-wheel-front,
        .card.selected [data-value="4-5"] #bike-wheel-rear {
            animation: spin-wheels 2s linear infinite;
        }


        /* 4. Hands Animation (6-7 days) */
        @keyframes move-hand-up {
            from { transform: translateY(5px); }
            to { transform: translateY(-5px); }
        }
        @keyframes move-hand-down {
            from { transform: translateY(-5px); }
            to { transform: translateY(5px); }
        }
        .card.selected [data-value="6-7"] #hand-left {
            animation: move-hand-up 1s infinite alternate ease-in-out;
        }
        .card.selected [data-value="6-7"] #hand-right {
            animation: move-hand-down 1s infinite alternate ease-in-out;
        }
    </style>
</head>
<body>

    <div class="background-container">
        <!-- Bubbles are generated by CSS -->
    </div>

    <div class="main-container">
        <h1>Select Your Fitness Level</h1>
        <p>Choose the option that best describes your weekly activity.</p>
        <div class="cards-container">
            <!-- Card 1: None -->
            <div class="card" data-value="0">
                <div class="card-icon">
                    <svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                        <defs>
                            <path id="bed-frame" d="M5,50 h90 v-5 h-2.5 v-20 h-80 v20 h-2.5z M10,45 v-15 h75 v15z M92.5,25 h-85 v-5 h85z" fill="currentColor"/>
                            <path id="mattress" d="M12.5,30 h75 v-2.5 h-75z" fill="currentColor" opacity="0.6"/>
                            <path id="pillow" d="M15,22.5 a10,5 0 0 1 20,0 v5 h-20z" fill="currentColor" opacity="0.6"/>
                            <text id="z-char" x="40" y="20" font-family="Poppins, sans-serif" font-size="16" font-weight="bold" fill="currentColor" opacity="0" transform="translate(0, 0)">Z</text>
                        </defs>
                        <use href="#bed-frame"/>
                        <use href="#mattress"/>
                        <use href="#pillow"/>
                        <use href="#z-char"/>
                    </svg>
                </div>
                <h3>None</h3>
                <p>Rest & Recovery</p>
            </div>

            <!-- Card 2: 1-3 -->
            <div class="card" data-value="1-3">
                <div class="card-icon">
                    <svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                        <g id="arm-group">
                            <path d="M40,50 Q50,20 60,25 L55,55z" fill="currentColor" opacity="0.5"/>
                            <path id="forearm" d="M60,25 Q90,30 85,50 L55,55 Q50,40 60,25" fill="currentColor"/>
                            <g id="dumbbell">
                                <rect x="82" y="32" width="5" height="16" rx="2" fill="currentColor"/>
                                <rect x="75" y="28" width="20" height="8" rx="2" fill="currentColor" opacity="0.7"/>
                                <rect x="75" y="44" width="20" height="8" rx="2" fill="currentColor" opacity="0.7"/>
                            </g>
                        </g>
                    </svg>
                </div>
                <h3>1-3 days/week</h3>
                <p>Light Activity</p>
            </div>

            <!-- Card 3: 4-5 -->
            <div class="card" data-value="4-5">
                <div class="card-icon">
                    <svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                        <g id="bike-body">
                             <!-- Frame -->
                            <path d="M30,45 L50,20 L70,20 L40,45 L55,45 L75,45" stroke="currentColor" stroke-width="2.5" fill="none" />
                            <!-- Seat -->
                            <path d="M45,15 L55,15" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
                             <!-- Rider Body -->
                            <circle cx="58" cy="12" r="5" fill="currentColor"/>
                            <path d="M58,17 L55,30 L45,40" stroke="currentColor" stroke-width="2.5" fill="none" />
                            <path d="M55,22 L70,18" stroke="currentColor" stroke-width="2.5" fill="none" />
                        </g>
                        <g id="bike-wheel-front" transform-origin="80 45">
                            <circle cx="80" cy="45" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
                            <path d="M80,35 L80,55 M70,45 L90,45 M73,38 L87,52 M73,52 L87,38" stroke="currentColor" stroke-width="1"/>
                        </g>
                        <g id="bike-wheel-rear" transform-origin="30 45">
                             <circle cx="30" cy="45" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
                             <path d="M30,35 L30,55 M20,45 L40,45 M23,38 L37,52 M23,52 L37,38" stroke="currentColor" stroke-width="1"/>
                        </g>
                    </svg>
                </div>
                <h3>4-5 days/week</h3>
                <p>Moderate Activity</p>
            </div>

            <!-- Card 4: 6-7 -->
            <div class="card" data-value="6-7">
                <div class="card-icon">
                    <svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
                       <g transform="translate(4, 5)">
                           <path id="hand-left" fill="currentColor" d="M26.2,35.2c-2.3-0.5-4.4-1.6-6.2-3.1c-1.3-1.1-2.5-2.5-3.4-4c-0.9-1.5-1.5-3.1-1.7-4.8c-0.2-1.7-0.1-3.5,0.4-5.2 c0.5-1.7,1.2-3.2,2.2-4.6c1-1.4,2.2-2.6,3.6-3.5c1.4-0.9,3-1.6,4.6-2c0.5-0.1,1-0.2,1.5-0.3c2.9-0.3,5.7,0.3,8.2,1.6 c1.1,0.6,2.1,1.3,3,2.2c0.9,0.9,1.7,1.9,2.4,3c-0.9,0.1-1.8,0.3-2.6,0.7c-2.3,1-4.1,2.8-5.2,5.1c-1,2.3-1.2,4.8-0.6,7.2 c0.6,2.4,2.1,4.5,4.1,6c2,1.5,4.5,2.3,7,2.2c0.5,0.7,0.9,1.4,1.2,2.2c0.3,0.8,0.5,1.7,0.5,2.5c0,1.9-0.8,3.7-2.1,5 c-1.3,1.3-3.1,2.1-5,2.1c-0.8,0-1.6-0.1-2.4-0.4c-0.8-0.3-1.5-0.6-2.2-1.1c-2.1-1.4-3.5-3.5-4.2-5.9c-0.7-2.4-0.6-5,0.3-7.3 c-1.5,0.4-3,0.5-4.5,0.3C27.7,35.5,26.9,35.4,26.2,35.2z"/>
                           <path id="hand-right" fill="currentColor" d="M73.8,35.2c2.3-0.5,4.4-1.6,6.2-3.1c1.3-1.1,2.5-2.5,3.4-4c0.9-1.5,1.5-3.1,1.7-4.8c0.2-1.7,0.1-3.5-0.4-5.2 c-0.5-1.7-1.2-3.2-2.2-4.6c-1-1.4-2.2-2.6-3.6-3.5c-1.4-0.9-3-1.6-4.6-2c-0.5-0.1-1-0.2-1.5-0.3c-2.9-0.3-5.7,0.3-8.2,1.6 c-1.1,0.6-2.1,1.3-3,2.2c-0.9,0.9-1.7,1.9-2.4,3c0.9,0.1,1.8,0.3,2.6,0.7c2.3,1,4.1,2.8,5.2,5.1c1,2.3,1.2,4.8,0.6,7.2 c-0.6,2.4-2.1,4.5-4.1,6c-2,1.5-4.5,2.3-7,2.2c-0.5,0.7-0.9,1.4-1.2,2.2c-0.3,0.8-0.5,1.7-0.5,2.5c0,1.9,0.8,3.7,2.1,5 c1.3,1.3,3.1,2.1,5,2.1c0.8,0,1.6-0.1,2.4-0.4c0.8-0.3,1.5-0.6,2.2-1.1c2.1-1.4,3.5-3.5,4.2-5.9c0.7-2.4,0.6-5-0.3-7.3 c1.5,0.4,3,0.5,4.5,0.3C72.3,35.5,73.1,35.4,73.8,35.2z"/>
                        </g>
                    </svg>
                </div>
                <h3>6-7 days/week</h3>
                <p>High Activity</p>
            </div>
        </div>
        <button class="submit-btn" disabled>Continue</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.card');
            const submitBtn = document.querySelector('.submit-btn');

            let selectedCard = null;

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Remove 'selected' class from the currently selected card if there is one
                    if (selectedCard) {
                        selectedCard.classList.remove('selected');
                    }

                    // Add 'selected' class to the clicked card
                    card.classList.add('selected');
                    
                    // Update the currently selected card
                    selectedCard = card;

                    // Enable the submit button
                    submitBtn.disabled = false;
                });
            });

            submitBtn.addEventListener('click', () => {
                if (selectedCard) {
                    const value = selectedCard.getAttribute('data-value');
                    alert(`You have selected: ${value} days/week. Let's build your plan!`);
                    // Here you would typically navigate to another page or show more content
                }
            });
        });
    </script>
</body>
</html>
